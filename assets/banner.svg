<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">memory-tidy</title>
  <desc id="d">Community plugin for Hermes Agent that keeps MEMORY.md and USER.md lean.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#12233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- left: wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="80" y="86" width="206" height="34" rx="17" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="183" y="109" text-anchor="middle" font-size="15" font-weight="600" fill="#6ee7b7" letter-spacing="1">COMMUNITY PLUGIN</text>
    <text x="78" y="196" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="-2">memory-tidy</text>
    <rect x="80" y="216" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="80" y="266" font-size="26" fill="#cbd5e1">Keep your agent's MEMORY.md and USER.md lean.</text>
    <text x="80" y="306" font-size="19" fill="#a8b5c7">Deterministic dedupe against SOUL.md and skills · dry run · backups · no network</text>
    <text x="80" y="346" font-size="17" fill="#94a3b8">for Hermes Agent ≥ 0.21.5 · Python ≥ 3.10 · MIT</text>
  </g>

  <!-- right: before / after memory cards -->
  <g font-family="'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="13">
    <!-- before stack -->
    <g transform="translate(830 80)">
      <text x="0" y="-12" fill="#a8b5c7" font-size="14" font-family="'Segoe UI', Arial, sans-serif" font-weight="600">BEFORE</text>
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#1e293b" stroke="#f87171" stroke-opacity="0.7"/>
      <text x="12" y="23" fill="#fca5a5">dup of SOUL</text>
      <rect x="0" y="46" width="140" height="36" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.7"/>
      <text x="12" y="69" fill="#fcd34d">procedure</text>
      <rect x="0" y="92" width="140" height="36" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.7"/>
      <text x="12" y="115" fill="#93c5fd">overlap A</text>
      <rect x="0" y="138" width="140" height="36" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.7"/>
      <text x="12" y="161" fill="#93c5fd">overlap B</text>
      <rect x="0" y="184" width="140" height="36" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="12" y="207" fill="#cbd5e1">unique fact</text>
      <rect x="0" y="230" width="140" height="36" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="12" y="253" fill="#cbd5e1">unique fact</text>
    </g>
    <!-- arrow -->
    <g transform="translate(993 213)">
      <path d="M0 0 H44" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
      <path d="M34 -10 L46 0 L34 10" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- after stack -->
    <g transform="translate(1060 80)">
      <text x="0" y="-12" fill="#a8b5c7" font-size="14" font-family="'Segoe UI', Arial, sans-serif" font-weight="600">AFTER</text>
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#0f2a2a" stroke="#34d399"/>
      <text x="12" y="23" fill="#6ee7b7">merged A+B</text>
      <rect x="0" y="46" width="140" height="36" rx="8" fill="#0f2a2a" stroke="#34d399"/>
      <text x="12" y="69" fill="#6ee7b7">unique fact</text>
      <rect x="0" y="92" width="140" height="36" rx="8" fill="#0f2a2a" stroke="#34d399"/>
      <text x="12" y="115" fill="#6ee7b7">unique fact</text>
      <rect x="0" y="138" width="140" height="36" rx="8" fill="none" stroke="#64748b" stroke-dasharray="5 4"/>
      <text x="12" y="161" fill="#a8b5c7">moved to skill</text>
    </g>
  </g>
</svg>
